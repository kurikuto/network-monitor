[project]
name = "network-monitor"
version = "1.0.0"
description = "クロスプラットフォーム対応のネットワーク通信可視化ツール"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["network", "monitoring", "visualization", "tcp", "udp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "psutil>=6.1.0",
    "prettytable>=3.12.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.8.0"]
dev = ["mypy>=1.13.0", "ruff>=0.8.0"]

[project.urls]
Homepage = "https://github.com/yourusername/network-monitor"
Documentation = "https://github.com/yourusername/network-monitor#readme"
Repository = "https://github.com/yourusername/network-monitor"
Issues = "https://github.com/yourusername/network-monitor/issues"

[project.scripts]
netmon = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "ui", "utils"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
